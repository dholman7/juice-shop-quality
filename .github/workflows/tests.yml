# Runs the full suite against a fresh Juice Shop on every pull request and publishes the report.
# The triage agent runs with the offline heuristic here; a team version would set
# TRIAGE_PROVIDER and an API key from the repository's secret store (never committed).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Suite, triage proposals, and report
        run: npm run all
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            reports/
            docs/coverage.md
