# Runs the ZAP baseline scan and the full suite against a fresh Juice Shop, and publishes the report.
# Pull requests get the report as an artifact. Main and the nightly run also publish it to GitHub Pages,
# carrying the run history forward so the report's Progress section shows a trend.
# The triage agent runs with the offline heuristic here; a team version would set
# TRIAGE_PROVIDER and an API key from the repository's secret store (never committed).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # nightly
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable  # use the Yarn version pinned in package.json
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn typecheck
      - run: yarn test:unit
      - name: Previous run history
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p reports
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" \
            -o reports/history.json || { rm -f reports/history.json; echo "No published history yet"; }
      - name: Suite, triage proposals, and report
        run: yarn all
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            reports/
            docs/coverage.md
      - if: always() && env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/

  publish:
    needs: test
    if: always() && needs.test.result != 'cancelled' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
